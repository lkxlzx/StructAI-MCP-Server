# StructAI MCP Server -- Alembic configuration (added by the P119+ MIDAS batch)
#
# Purpose: the 7 MIDAS-adapter tables (docs/07 section 4.4) MUST be created by an
#          Alembic migration; the server must never create/alter them silently at
#          startup (docs/07 section 14.3). The 24 Core tables (docs/07 section 4.3)
#          keep being created by Base.metadata.create_all in acceptance scripts and
#          tests; the two table sets are independent (see midas/models.py ruling 1).
#
# NOTE: this file is intentionally ASCII-only: Alembic reads it with the process
#       locale encoding, so non-ASCII comments break startup on some locales.
#
# The connection URL is NOT hard-coded here: migrations/env.py reads it from
# Settings (DATABASE_URL).

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S