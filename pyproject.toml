# StructAI MCP Server —— P01 Bootstrap
# 技术栈与依赖清单冻结于 docs/07 §3.1 / §3.2；项目结构冻结于 docs/07 §3.3。
# 禁止项见 docs/07 §14。

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "structai-mcp-server"
dynamic = ["version"]
description = "StructAI MCP Server —— 多结构工程软件一体化 MCP Server（Core）"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "structural-engineering"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Private :: Do Not Upload",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  # `[asyncio]` 附加 greenlet —— SQLAlchemy 异步栈的硬依赖（docs/02 §2.2 全链路异步）。
  # 缺少 greenlet 时 `sqlalchemy.ext.asyncio` 直接 ImportError，P04 无法运行；
  # 故在 docs/07 §3.2 冻结清单的 `sqlalchemy>=2.0` 上补足官方推荐的 extra 写法。
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.14",
  "aiosqlite>=0.20",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "structlog>=25.1",
  "mcp",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25", "pytest-cov>=6.0"]
dev = ["ruff>=0.9", "mypy>=1.14", "pre-commit>=4.0"]

[project.scripts]
structai-mcp = "app.main:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["archive", "registry", "examples", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]
exclude = ["^archive/", "^registry/", "^examples/", "^docs/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
