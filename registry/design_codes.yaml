# E. 运行时发现机制（Adapter 连接时执行，结果不落盘）
#
#   实测结论（2026-10-05，gen-local + civil-cloud）：
#   1. 「读当前生效的规范」—— 完全可行，零副作用：
#        GET /db/DCON   -> {"DCON":{"1":{"DGNCODE":"..."}}}
#        GET /db/DSTL   -> {"DSTL":{"1":{"DGNCODE":"..."}}}
#        GET /db/MODULE -> {"Module":0,"DgnCode":3}
#      注意：项目未设置设计时返回 {} 或 {"message":""}（空表），不是错误。
#   2. 「读全部支持集」—— API 不直接提供：
#        /info/db/DCON 返回 schema，但 DGNCODE 是 type:string，无 enum
#        裸路径 /DESIGN、/DESIGN/RC 等一律 404，无法列子节点
#      => 支持集只能来自本文件的静态枚举（手册来源）
#   3. 「验证某实例是否支持某规范」—— 可行，探测式：
#        GET /DESIGN/{material}/{code}/{probe_endpoint} -> 200 支持 / 404 不支持
#        实测：/DESIGN/RC/KDS-41-20-2022/DCO -> 200
#              GB50010-2010 / ACI318-19 / AISC360-16 / EN1992-1-1 / AIJ -> 404
#        交叉约束有效：/DESIGN/RC/KDS-41-30-2022/DCO -> 404（钢规范不能用于 RC）
#      => Adapter 用本文件的候选集做探测输入，得到该实例的可用子集
# ============================================================================
discover:
  strategy: static_candidates_plus_runtime_probe
  runtime_probe:
    method: GET
    probe_endpoint: DCO
    ok_status: 200
    not_supported_status: 404
    side_effect: none
    cache_scope: connection_session
    persist: false
  static_source_of_truth: this_file
