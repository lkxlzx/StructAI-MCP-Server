notes: ["`DIR`(1~4)·`DV`·존재하지 않는 `\"SK\"` 필드로 잘못 기재하고 있었다(아티클 id `35945908301081`). 실제로는 **COMP/TENS는 `STIFF`(단일 강성값)**, **MULTI는 `FUNCTION`(MLFC 함수 ID)**을 쓰며, `DIR`은 0~6(Vector 포함) enum이고 `DV`는 `DIR=6` (Vector)일 때만 쓰는 방향 벡터다. LINEAR 타입의 `Cr`(감쇠계수 배열)도 누락돼 있었다."]
