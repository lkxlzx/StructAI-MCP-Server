notes: ["잘못 기재(실제로는 **`\"SLD\"`**, 데이터 객체 키만 `\"SB\"`), (2) LRB의 `DX`/`OPT_CONS_NONL`/ `BETA`/`ALPHA`/`SIGMA_V`를 서로 같은 레벨의 형제 필드로 잘못 기재(실제로는 **`DX`가 `{OPT_CONS_NONL, BETA, ALPHA, SIGMA_V}`를 담는 하위 객체**), (3) LRB의 `KE`·`K0`(이름이 비슷하지만 별개인 두 초기강성 필드) 중 `K0`을 누락, (4) NRB Data가 `KH` 하나뿐인 것으로 잘못 기재(실제로는 `AR`/`TR`/`KH`/`DX{...}` 4+4개), (5) SB Data의 `QD`(Index)·`Pi_VALUE`를 누락한 채 작성돼 있었다. 원문 JSON Schema + Request Exampl"]
