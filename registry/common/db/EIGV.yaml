notes: ["표기해 General/Ground Acc. 두 분기를 뭉뚱그렸지만, JSON Schema는 `CASE`와 `GROUND`를 별개 속성으로 선언하고 있고 원문 예제·아래 로컬 예제 모두 Ground Acc. 항목엔 `\"GROUND\"` 키를 쓴다 (표가 자기 예제와도 모순). 예제·스키마 우선 원칙에 따라 표를 분리해 정정(아티클 id `35989224565273`).", "`iDIM`/`TOL`이 잘못 섞여 있었다(위 Lanczos 파라미터 표에도 없는 필드). 원문 Lanczos 예제에 없는 필드라 삭제(아티클 id `35989224565273`)."]
