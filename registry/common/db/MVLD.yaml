notes: ["Specifications 표 원문을 다시 보면 4개 필드 모두 Required로 표기돼 있어 보강함(원문 아티클 [Moving Load Cases](https://support.midasuser.com/hc/en-us/articles/35959068573209)).", "있었으나, 실제로는 `LOAD_MODEL`(0~3)·`LOAD_COMB_TYPE`(하중계수 종류)·`FATIGUE`(Load Model 1 전용) 3개 필드가 추가되고, Heavy Load Platform(`LOAD_MODEL=2`)은 `DEFAULT` 대신/함께 별도 `ASL` 객체를 씁니다.", (한계상태 그룹)이 추가됩니다.]
