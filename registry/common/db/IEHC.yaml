notes: ["필드 9개가 통째로 빠져 있었다(아티클 id `35944093809689`). 기존 Request Body 예제도 `CoverDivNumNy`/`CoverDivNumNz`처럼 원문에 없는 키를 쓰고 있었는데, 실제 키는 `BeamDivNumNyCover`/`BeamDivNumNzCover`다 — 원문 Examples 그대로 교체했다.", "문자열 `\"AUTO\"`를 그대로 전송한다. 이 저장소 관례상 예제가 표보다 우선하므로 예제 값을 그대로 옮겼다 — 실제 전송 시 표기(Integer vs `\"AUTO\"`)에 유의할 것."]
