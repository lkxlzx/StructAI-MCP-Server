notes: ["`bLAMBDA`/`dLAMBDA`/`bTRANSFER`/`dTRANSFERFCI` 4개 필드는 JSON Schema에만 있고 원문 Specifications 표·Request Example 어디에도 설명·예시가 없다 — 경량콘크리트 λ계수·프리스트레스 전달강도 관련으로 추정되나 필수 여부·기본값 근거가 없어 참고용으로만 표기한다. 여기에 더해 **2026-09-01 갱신으로 최상위에 3개 필드가 새로 추가**됐는데(아래 표 참고), 이들 역시 스키마에만 있고 표·예제에는 없다. ⚠️ **원문 JSON Schema 구문 오류(2026-09-06 확인):** 새로 추가된 `\"bSERVCHECK\"` 바로 앞, `SUBREBAR_B_FY` 블록을 닫는 `}` 뒤에 **쉼표가 빠져 있어** 스키마 블록 전체가 유효", "사용자는 이 세 필드의 존재를 알 수 없다. 2026-09-18 라이브 검증에서 세 필드 모두 실제로 전송· 저장되는 것이 확인되어(`bSERVCHECK=true`, `dSHORTTERM=1.25`, `dLONGTERM=1.5`), 죽은 스키마가 아니라 **표가 빠진 것**임이 분명해졌다. 다만 각 필드의 의미는 여전히 스키마 설명 문자열 기반 추정이므로 위 \"(추정)\" 표기는 유지한다. 검증 상세는 [live_verification_feedback_20260918.md](../error_reports/live_verification_feedback_20260918.md) 참고."]
