notes: ["문서화되어 있지 않았음(MVHL과 동일한 유형의 누락). 원문 [Response Spectrum Functions - China](https://support.midasuser.com/hc/en-us/articles/39473334759065) 기준, 9개 코드 중 가장 최신·대표적인 GB50011-2010만 전체 필드를 문서화하고 나머지 8개는 SPEC_CODE 매핑표로 정리(SECT/TDMT 원칙).", "자체가 7개 코드를 다루는 대형 아티클이라, 가장 최신인 Taiwan(2022)만 전체 필드를 문서화한다.", "가 8개 국가 코드를 다루는 대형 아티클이라, 가장 필드가 단순한 Canada(NBC95)만 전체 문서화하고 나머지는 SPEC_CODE 매핑만 남긴다."]
