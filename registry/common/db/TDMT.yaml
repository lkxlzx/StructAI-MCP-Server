notes: ["`AS_2017_AMD_2024`, `AS_2018_AMD_2021`, `NEWZEALAND_2022`, `CHJTG_T_D65_2015`)을 원문(아티클 id `35808006330009`) 대조로 추가했다. ⚠️ **2026-07-25 정정:** `CODE` 값은 `\"KDS2016\"`(구분자 없음)이 아니라 **`\"KDS_2016\"`**(언더스코어)입니다. 이전 버전 문서와 아래 예제가 잘못 표기되어 있었습니다. 공식 아티클의 Request Examples (`\"KDS-2016, KCI-USD12, KSCE 2010, Korea Standard\"` 예제)에서 실제 페이로드로 확인했습니다. `/db/TDME`(§7)의 동일 계열 필드 `CODENAME`은 이와 달리 `\"KDS-2016\"`(하이픈)을 쓰므로"]
