notes: ["`COUPLED_INPUT_METHOD` 3개가 누락돼 있었다(아티클 id `35946764618905`). 이 원문은 `APPLICATION_TYPE`/`APPLICATION_TYPE_D` 조합 14가지마다 별도 파라미터 세트(장치별 상세 물성)를 갖는 6000줄 이상의 방대한 문서라, 위 \"APPLICATION_TYPE 조합표\"에 정리한 개요 수준으로만 다루고 조합별 상세 필드는(SDVI/SDVE/SDST/SDHY/SDIS로 참조되는 것 외의 FORCE 계열 GAP/HOOK/HS/LRBI/FPSI/TFPSI 등) 전수 기재하지 않는다(SECT/TDMT/FIMP와 동일 원칙)."]
