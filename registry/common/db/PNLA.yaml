notes: ["\"SOLID\"` 조건 행의 Key 오기(`\"SELECT_TYPE\"` → `\"ELEM_TYPE\"`)는 정정됐었으나, 같은 행의 **설명 문구는 여전히 `Element Select Type`으로 남아 있다**(원문 그대로: `When Element Select Type, \"ELEM_TYPE\" is \"SOLID\"`). 같은 표의 첫 조건행은 `When Element Type, \"ELEM_TYPE\" is \"PLATE\"`로 올바르므로 이 행만 문구 정정이 덜 된 상태다. **신규 회귀 — `SELECT_TYPE = \"IN_GROUP\"` 조건 행의 Key가 오염됐다.** 2026-09-06 시점에는 `When Element Select Type, \"SELECT_TYPE\" is \"IN_GROUP\"`으로 Key가 올바르게"]
