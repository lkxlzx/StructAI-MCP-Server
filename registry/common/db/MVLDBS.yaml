notes: ["`LCDATA_STANDARD`/`LCDATA_SPECIAL`/`LCDATA_ALLMODE` 하위 필드 전체와 Moving Load Optimization 전용 3개 객체(`LCDATA_STANDARD_OPTI`/`LCDATA_SPECIAL_OPTI`/`LCDATA_ALLMODE_OPTI`)가 완전히 누락돼 있었음. 원문 자체가 4개 Load Model × General/Optimization 2개 모드 = 8개에 가까운 조합을 다루는 대형 아티클이라(SECT/TDMT와 동일 원칙), 가장 대표적인 `LCDATA_STANDARD`만 전체 필드를 싣고 나머지 5개 객체는 아래 요약표로 정리한다 — 전체 필드는 원문 [Moving Load Cases - BS](https://support.midasuser.co"]
