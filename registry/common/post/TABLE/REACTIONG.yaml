notes: ["모두 `\"REACTIONSURFACESPRING\"`으로 일치하나, \"Reaction(Local-Surface Spring)\" Request Example 하나만 `\"REACTIONLSURFACESPRING\"`(L 추가)을 사용한다. 표·스키마 2곳이 일치하는 쪽을 채택하고 예제 쪽의 단발성 오타로 판단했으나, 실제 API 동작은 검증하지 않았으므로 오류제보 대상으로 남김.", "추가되며, 그 안에 `SUMMATIONOFREACTIONFORCESPRINTOUT` 하위 테이블(`HEAD`: `[\"Load\", \"FX(kN)\", \"FY(kN)\", \"FZ(kN)\"]`, 시공단계 조회 시 `Stage`/`Step` 추가)이 포함된다. 이전 버전 문서에는 반영되어 있지 않아 아래 예제에 추가함. `REACTIONL`/`REACTIONSURFACESPRING`에는 `SUB_TABLES`가 없다."]
