notes: ["`OPT_CS: true`·`STAGE_STEP: [\"nl_001\"]`·`LOAD_CASE_NAMES: [\"SelfWeight(CS)\"]` 요청을 잘못 붙여 놓아 실제로는 짝이 맞지 않는 요청/응답 조합이었음(5절 Cable Force와 동일한 문제). 아래에 두 시나리오를 정확한 요청/응답 쌍으로 분리해 정정. 시공단계 응답이 `SkewAngle` 2개 컬럼을 아예 빠뜨리는 것은 원문 자체의 특이사항으로, 원문의 시공단계 Request Example이 `COMPONENTS`에 `\"IEnd\"`/`\"JEnd\"`를 명시적으로 요청함에도 실제 응답엔 반영되지 않는 자기모순 — 오류제보 대상."]
