# ⚠️ **P160d（**未**收口 —— 如实留缺）**：`POST /gen/VIEW/RESULTGRAPHIC` → **`400`**
# `{"error":{"message":"MIDAS GEN NX second query is wrong"}}`
# 取值 = `CURRENT_MODE: "displacement"` + `LOAD_CASE_COMB: {TYPE: "ST", NAME: "CASE1"}`，
# 在**无分析结果**的项目上测得。
#
# ✅ **P164-d / R155：成因已定（**更正**「成因未定」）**
# 本端点是**多变体端点** —— 手册里 **34** 篇文章（`… - Result Display` /
# `… - Moving Tracer Display` / `… - Mode Shapes Display` / `… - Heat of Hydration Display`）
# 都映射到 `view/RESULTGRAPHIC`，**由 `Argument.CURRENT_MODE` 选变体**，共 **36** 个取值
# （**56** 条示例）。而 `"displacement"` **不在**这 36 个里
# ⇒ 那一次的 `400` = **变体选择子取值非法**，**不是**「缺分析结果」。
# 最接近的合法取值 = `DisplacementContour` / `MVLTRC_Displacements`。
# 证据（**离线、零请求、可复算**）= `registry/live/view_result_modes.json`
# （生成器 `registry/tools/extract_result_modes.py`，逐条回溯到文章标题 / 示例名 / URL）。
#
# ⚠️ **数据侧缺口（如实记录、本批不修）**：本端点的**请求 Schema**
# （`registry/schema/common/view/RESULTGRAPHIC.json`）的 `Argument` **只**声明
# `TYPE_OF_DISPLAY`（= **36** 个变体里的**一个**）⇒ **R140 的 `spec_guard` 抓不到非法的
# `CURRENT_MODE`**（没有枚举可查）⇒ 非法取值会一路发到原生。补全 36 个变体的 Schema
# 是**单独一次数据侧作业**（须裁决），**不**在本批硬凑。
#
# ⚠️ **不**据此升级 `availability`（**保持 `untested`**）。
# 恢复条件 = 用**表内**的 `CURRENT_MODE` 取值，在**有分析结果**的项目上重测并读到结果行。
#
# ✅ **P164-f / R157：真机重测做完了 —— 效果判据 FAILED ⇒ 仍**不**收口**
# 2026-10-14 在 `gen-local` 的混凝土简支梁（21 节点 / 20 单元 / 工况 `DL` / 63 行位移结果）上，
# 用**表内**取值实测：`RESULTGRAPHIC(DisplacementContour)` 与 `(DeformedShape)`
# **都**回 **`200`**（R150 的 `second query is wrong` **确实**只是取值非法 ⇒ R155 成立），
# **但改前/改后截图字节完全相同**（三次 32023 字节 · 同一 sha256）⇒
# **`200` 是静默空转**，**画面没变** ⇒ **铁律 ⓪** 的效果判据**不成立**。
#
# ⚠️ **方法学（缺一不可）**：**阳性对照**必须先通过 —— `VIEW.DISPLAY` 的
# `ELEMENT.ELEM_NUMBER` 开/关会让截图**真的不同**（38869 vs 32023 字节）
# ⇒ 截图**确实**能看见显示变化 ⇒ 「无差异」**不是**仪器失灵。
# ⚠️ 另记：`VIEW.CAPTURE` 的 `SET_MODE: "post"` 也回 `200` 但截图与 `pre` **相同**
# ⇒ 与 `docs/nxsdk_review` 的实测摘要一致（**纯 API 进不了 post 模式**，需 GUI 手动点）。
# ⇒ **成因未定**（原生空转？进不了结果视图？），**如实留缺**。
#
# 恢复条件（更新）= ① 确认是否存在**纯 API** 进入结果视图（post）的路径；
# ② 或由 **MIDAS 侧**澄清 `RESULTGRAPHIC` 的生效前提。
# 证据 = `registry/live/view_result_effect_probe.json`（生成器
# `registry/tools/probe_view_result_effect.py`，默认预演 / `--probe` 真机 / `--check` 离线自洽）。
#
# ✅ **P166 / R159：纯 API 路径**找到了** —— R157 的「静默空转」成因已定 ⇒ **收口**
# **成因（R157 的答案）**：P164-f 的请求体**只有** `CURRENT_MODE` + `LOAD_CASE_COMB`，
# **缺** `TYPE_OF_DISPLAY` —— 而 `TYPE_OF_DISPLAY.<子块>.OPT_CHECK = true` 才是
# **真正把结果图形打开**的那个开关。没有它，原生**照样回 `200`** 但**什么都不画**
# （与 **R119 / R128 / R145 / R146** 同族的「静默 `200`」）。
#
# **纯 API 进结果视图（post）的路径（手册自己的写法，实测成立）**：
#   · `POST /VIEW/CAPTURE` 的 `Argument.SET_MODE`（`"pre"` / `"post"`）**切换视图模式**（粘性）；
#   · 结果图形由 `POST /VIEW/RESULTGRAPHIC`（**持久**）或 `CAPTURE` 的
#     `Argument.RESULT_GRAPHIC`（**一次性覆盖**）配置，且**只在 post 模式下渲染**。
#   ⇒ `SET_MODE: "post"` + `TYPE_OF_DISPLAY` 打开 ⇒ 截图里**真的**出现图例 / 云图 / 变形 /
#     工况名（`ST: DL`），与 pre 模式的模型视图**判然不同**。
#
# **效果判据（铁律 ⓪）= `PASSED`**（2026-10-15，`gen-local`，自建混凝土简支梁，工况 `DL`）：
#   · ① 基线**可复现**（同设置连拍两次 ⇒ **0** 字节差异 = 噪声地板）
#   · ② 改前 / 改后：`33438` → **`81236`** 字节（**2.4×**）
#   · ③ 换 `CURRENT_MODE`（`DisplacementContour` → `DeformedShape`）：`81236` → **`84494`**
#   · ④ 同取值复现：`81236`（与 ② 逐字节相同）
#   · ⑤ 图形关掉 ⇒ **`33438`**（回到基线）
#   · ⑥ `SET_MODE: "pre"` ⇒ 结果**画不出来**（`32457`，与结果视图判然不同）
#   · ⑦ **阳性对照**：`VIEW.DISPLAY` 的 `ELEMENT.ELEM_NUMBER` 开/关 ⇒ **`40211` vs `33438`**
#   ⇒ **7 / 7** 满足 ⇒ `availability` **收口为 `verified`**（**只升不降**，同 §4 口径）。
#
# ⚠️ **本批只改「现状声称」**：R155 / R157 的**历史记录原样保留**（它们在当时都是对的）。
# 证据 = `registry/live/view_result_post_probe.json`（生成器
# `registry/tools/probe_view_result_post.py`，默认预演 / `--probe` 真机 / `--check` 离线自洽）；
# 判定 = `tests/test_midas_view_result_post_p166.py`；裁决 = `docs/07` §16.1 **R159**。
# ⚠️ **数据侧缺口仍在**（R155 记录、**本批不修**）：请求 Schema 的 `Argument` **只**声明
# `TYPE_OF_DISPLAY` ⇒ `spec_guard` **没有** `CURRENT_MODE` 的枚举可查。
