# StructAI Registry 实测实例矩阵
#
# 记录每个实例的实测结果，供 Registry 的 availability / verified_on / unavailable_on 字段溯源。
# 冒烟脚本按此基线比对，差异即告警。凭据（MAPI-Key）绝不写入本文件。
instances:
  - alias: gen-local
    product: GEN_NX
    base_url: http://localhost:3030/gen
    probe_host_warning: >-
      ⚠️ 探活**必须**用主机的 `localhost` / `[::1]`（= 本文件的 base_url），
      **不**要用 IPv4 `127.0.0.1`：本实例**只**监听 `::1`（netstat 实测
      `TCP [::1]:3030 LISTENING`）⇒ 用 `127.0.0.1` 会拿到 `ConnectionRefused`，
      从而把**可达**的实例误判为「未运行」。此误判已**三次**发生
      （P138 自我更正 · P139 记为已知坑 · P172/P173 又踩，见 R167）。
    profile: NX_FAMILY
    # ⚠️ **基线快照，不是当前值**（P179 标注）：下列 5 个字段是 **2026-05-07** 那一次
    # L4 全量只读扫描的结果。此后 `availability` 持续演进（P134–P178 逐批收口），
    # 当前 `manifest.json` 里 `verified_on` 含 `gen-local` 的端点是 **484** 个。
    # ⇒ 读这些字段时**必须**连同 `tested_at` 一起读；**不**要把 253 当成「现在只验过 253 个」。
    tested_at: "2026-05-07"
    loaded_project: portrait_truss_80m
    get_endpoints_tested: 253
    routed_ok: 217
    routed_empty: 0
    not_found: 36
    note: >-
      本地部署实例。缺 21 个 Hyper-S 变体与 15 个桥梁/铁路专项表，版本明显落后于云实例。
      ⚠️ 上列计数是 **2026-05-07** 的快照；当前 `verified_on: [gen-local]` 的端点数
      以 `registry/manifest.json` 为准（P179 实测 **484**）。

  - alias: civil-cloud
    product: CIVIL_NX
    base_url: https://moa-engineers.midasit.cn:443/civil
    profile: NX_FAMILY
    tested_at: "2026-05-07"
    probed_at: "2026-10-14"
    probe_evidence: registry/live/civil_product_probe.json
    loaded_project: (共享云账号，会话状态在测试期间变化过)
    get_endpoints_tested: 215
    routed_ok: 29
    routed_empty: 179
    not_found: 7
    note: >-
      未知 URI 返回 404（可靠）；空表返回 200 + {"message": ""}。缺 DB.SDHY/SDIS/THRS/UFTR/UTBL 与 2 个 DESIGN.*.MATD。
      ⚠️ 2026-10-14 的产品级只读探针（49 条：21 条 B 级候选 + 全部 21 条 Hyper-S -M1 + 三组对照）
      结论：**21 条 Hyper-S `-M1` 在本实例上全部 404**（与外部证据「Hyper-S 是 Civil NX 专属」冲突，
      见 registry/README.md §8.17.3）；B 级 21 条中 18 条存在、3 条不存在（DB.POSP / DOC.STAGAS /
      POST.STEELCODECHECK）。**本实例缺少 Hyper-S 求解器能力**，不代表产品不支持。

  - alias: designer-cloud
    product: CIVIL_DESIGNER
    base_url: https://moa-engineers.midasit.cn:443/cdn
    profile: DESIGNER
    tested_at: "2026-05-07"
    get_endpoints_tested: 13
    routed_ok: 13
    routed_empty: 0
    not_found: 0
    note: >
      响应封装为 {command, function, result:{return_value, message}}；
      **任何 URI 都返回 HTTP 200**（/foo/BAR 亦然），HTTP 状态码不可用于判定可用性。
      唯一可靠错误信号是 result.message[].type == "错误"。
      因此该产品的「端点不存在」无法通过 GET 验证，可用性只能以官方手册为准。
      单位约定：返回 mm（NX 系返回 m）。
