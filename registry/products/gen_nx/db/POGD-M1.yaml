notes: ["Displacements:2로 잘못 기재했다. 원문 JSON Schema의 description은 단어 나열 순서가 \"None / P-Delta / Large Displacements\"라 이를 그대로 따른 것이 원인으로 보이나, 원문 Specifications 표는 명시적으로 None:0/**Large Displacements:1**/**P-Delta:2**로 번호를 매겨 놓았다(스키마 설명 문구와 표가 서로 모순 — 표가 우선). 09장 `/db/THGC-M1`의 동명 필드 `GEO_NONL_TYPE`도 0=None/1=Large Disp/2=P-Delta로 동일 순서라 교차 확인됨(아티클 id `56511008007705`)."]
