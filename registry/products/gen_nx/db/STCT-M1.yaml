notes: ["누락돼 있었다. 특히 `iBSC`는 레거시 `STCT`(17번 절)와 이름은 같지만 **기본값이 다르다** (STCT는 0, STCT-M1은 1)(아티클 id `57053813627673`).", "추가돼 있었고, `bIEMF`가 통째로 누락돼 있었다(아티클 id `57053813627673`).", "`\"SHRINK\"`와 달리 STCT-M1에서는 **`\"SHRINKAGE\"`**로 표기된다 — 원문 JSON Schema·Specifications 표 양쪽에서 일관되게 확인됨(아티클 id `57053813627673`). 이전 문서는 STCT와 동일하게 `\"SHRINK\"`로 잘못 기재돼 있었다."]
