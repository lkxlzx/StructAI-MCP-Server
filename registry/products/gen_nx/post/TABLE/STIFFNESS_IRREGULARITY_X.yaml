notes: ["`\"Max. Drfit of All Vertical Elements\"` 오타(`Drfit`→`Drift`)를 지적하는 주석이 있었으나, 재확인 결과 공식 원문이 이미 `\"Drift\"`로 정정되어 있습니다(더 이상 오타 아님 — 지난 동기화 이후 공식 측이 수정한 것으로 보임). 또한 두 항목의 `기본값`이 이전 버전에는 각각 `\"Drift at the Center of Mass\"`/`\"1 / Story Drift Ratio\"`로 잘못 기재되어 있었는데, 공식 표는 둘 다 `Default: System`으로 명시하므로 정정했습니다."]
