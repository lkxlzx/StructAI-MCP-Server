# ⚠️ **P171 / R164：`DGNCODE` 的枚举**如实留缺**（问题已从「形状不明」**收窄为一次是非问答**）。
# **机械事实**：本 build 对 `POST /OPE/LCOM-GEN` 的**任何**取值都回 `400 Wrong Field`
#   （证据 = `registry/live/lcom_dgncode_probe.json`，P169 真机）—— **连手册声明的合法值**也一样。
# **新证据（零请求，本仓可读）**：手册**自己的** `json_schema`
#   （`MIDAS_API_Online_Manual_数据_v1.0.json#253`）与本文件对应的**已落盘** Schema
#   （`registry/schema/products/gen_nx/ope/LCOM-GEN.json`）**逐字节同形**（同一份 `oneOf` 三分支、
#   同一句 `Body structure is selected by CODE_SELECTION.`）⇒ **不**存在「手册扁平 vs 我方 `oneOf`」
#   的形状分歧 —— 那份 `oneOf` 就是**上游**的声明。
# ⚠️ 而 `Wrong Field` 在**同族**端点上的**唯一**已知成因是**键名错**（**E-02**：`POST.TEXT` 的
#   `TABLE_TYPE` 任何取值都回 `Wrong Field`，实测契约键是 `TEXT_TYPE`）⇒ 疑点**收窄为一处**：
#   `OPTION` 这个键名（手册**另一族** `OPE.LCOM-{CONC,STEEL,SRC}` 的 `json_schema` 也用 `OPTION`，
#   **不构成**独立佐证）。
# ⚠️ 该端点**不在任何 OperationPlan 的生产路径上**（`operations.py` 里 0 处）。
# 恢复条件：产品侧答**一次是非** —— 本 build 的请求体里选择操作的那个键叫 `OPTION` 吗？
#   **是** ⇒ 形状分歧排除，剩下的唯一可能是本 build **未实现**该端点 ⇒ 登记为**产品缺陷 / 不支持**
#   （与 **R154** 的 `BD-ANAL` 同档），**不**再当「待澄清」；**否** ⇒ 给出正确键名 ⇒ 登记我方 Schema 勘误。
#   届时重跑 `python registry/tools/probe_lcom_dgncode_p169.py --probe` 复核。
