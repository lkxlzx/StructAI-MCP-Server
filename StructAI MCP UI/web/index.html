<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIDAS MCP 管理器</title>
<link rel="stylesheet" href="styles/tokens.css?v=185">
<link rel="stylesheet" href="styles/base.css?v=185">
<link rel="stylesheet" href="styles/shell.css?v=185">
<link rel="stylesheet" href="styles/components.css?v=185">
<link rel="stylesheet" href="styles/pages/home.css?v=185">
<link rel="stylesheet" href="styles/pages/ai.css?v=185">
<link rel="stylesheet" href="styles/pages/clients.css?v=185">

<body>
<div class="app">

  <!-- ========== 顶部标题栏 ========== -->
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="MIDAS MCP 管理器">
      <span class="brand-logo" data-icon="logo"></span>
      <span class="brand-text">
        <span class="brand-title">MIDAS MCP 管理器</span>
        <span class="brand-sub">Connect MIDAS · Empower Engineering with AI</span>
      </span>
    </a>

    <div class="topbar-right">
      <div class="run-state" id="runState">
        <span class="dot dot-green"></span><span class="run-state-text">MCP 运行中</span>
      </div>
      <span class="version-badge" id="versionBadge">v1.0.0</span>
      <button class="icon-btn" id="btnSettings" type="button" title="系统设置" data-icon="gear"></button>
      <div class="win-actions" id="winActions">
        <button class="win-btn" type="button" title="最小化" data-win="minimize"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <button class="win-btn" type="button" title="最大化" data-win="maximize"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button class="win-btn win-close" type="button" title="关闭" data-win="close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </header>

  <!-- ========== 主体：左侧导航 + 内容区 ========== -->
  <div class="app-body">
    <aside class="sidebar">
      <nav class="nav" id="nav"></nav>
      <div class="side-status" id="sideStatus"></div>
    </aside>
    <main class="content" id="view" tabindex="-1"></main>
  </div>

  <!-- ========== 底部栏 ========== -->
  <footer class="app-footer">
    <div class="footer-left" id="footerLeft"></div>
    <div class="footer-right" id="footerRight"></div>
  </footer>
</div>

<script src="scripts/pages/tools.js?v=185"></script>

</body>
</html>
